name: Fortress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  resolve-age:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      checksums: ${{ steps.resolve.outputs.checksums }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Resolve Verified age Release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bundled_age_version="$(tr -d '[:space:]' < AGE_VERSION)"
          committed_age_checksums="$(cat AGE_CHECKSUMS)"
          resolved_age_version="$bundled_age_version"
          resolved_checksums="$committed_age_checksums"
          should_build=true

          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_metadata="$RUNNER_TEMP/age-release.json"
            curl --fail --silent --show-error --location --retry 3 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$release_metadata" \
              "https://api.github.com/repos/FiloSottile/age/releases/latest"

            latest_tag="$(jq -er '.tag_name' "$release_metadata")"
            if [[ ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid age release tag: $latest_tag" >&2
              exit 1
            fi
            resolved_age_version="${latest_tag#v}"

            resolved_checksums="# version os arch sha256"
            append_digest() {
              local release_os="$1"
              local release_arch="$2"
              local archive_extension="$3"
              local asset_name="age-v${resolved_age_version}-${release_os}-${release_arch}.${archive_extension}"
              local digest
              digest="$(jq -er --arg asset "$asset_name" \
                '.assets[] | select(.name == $asset) | .digest' \
                "$release_metadata")"
              digest="${digest#sha256:}"
              if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
                echo "Missing valid SHA-256 digest for $asset_name" >&2
                exit 1
              fi
              resolved_checksums+=$'\n'"$resolved_age_version $release_os $release_arch $digest"
            }

            append_digest darwin arm64 tar.gz
            append_digest darwin amd64 tar.gz
            append_digest linux amd64 tar.gz
            append_digest linux arm64 tar.gz
            append_digest windows amd64 zip

            if [[ "$resolved_age_version" == "$bundled_age_version" && "$resolved_checksums" != "$committed_age_checksums" ]]; then
              echo "The published digests for age v$bundled_age_version changed; refusing an automatic replacement." >&2
              exit 1
            fi

            if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$resolved_age_version" == "$bundled_age_version" ]]; then
              should_build=false
              echo "age v$bundled_age_version is already pinned; no rebundle is needed."
            elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
              printf '%s\n' "$resolved_age_version" > AGE_VERSION
              printf '%s\n' "$resolved_checksums" > AGE_CHECKSUMS
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add AGE_VERSION AGE_CHECKSUMS
              git commit -m "Update bundled age to v$resolved_age_version"
              git push origin HEAD:main
            fi
          fi

          {
            echo "version=$resolved_age_version"
            echo "should_build=$should_build"
            echo "checksums<<FORTRESS_AGE_CHECKSUMS"
            printf '%s\n' "$resolved_checksums"
            echo "FORTRESS_AGE_CHECKSUMS"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-age
    if: needs.resolve-age.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact_path: target/x86_64-pc-windows-msvc/release/fortress.exe
            artifact_name: fortress-windows-x86_64-bin
            package_artifact_name: fortress-windows-x86_64
            package_archive: fortress-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_path: target/x86_64-unknown-linux-gnu/release/fortress
            artifact_name: fortress-linux-x86_64-bin
            package_artifact_name: fortress-linux-x86_64
            package_archive: fortress-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_path: target/aarch64-unknown-linux-gnu/release/fortress
            artifact_name: fortress-linux-aarch64-bin
            package_artifact_name: fortress-linux-aarch64
            package_archive: fortress-linux-aarch64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_path: target/aarch64-apple-darwin/release/fortress
            artifact_name: fortress-core-macos-aarch64-bin
            package_artifact_name: fortress-macos-aarch64
            package_archive: fortress-macos-aarch64.zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_path: target/x86_64-apple-darwin/release/fortress
            artifact_name: fortress-core-macos-x86_64-bin
            package_artifact_name: fortress-macos-x86_64
            package_archive: fortress-macos-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Apply Resolved age Pin
        shell: bash
        env:
          RESOLVED_AGE_VERSION: ${{ needs.resolve-age.outputs.version }}
          RESOLVED_AGE_CHECKSUMS: ${{ needs.resolve-age.outputs.checksums }}
        run: |
          printf '%s\n' "$RESOLVED_AGE_VERSION" > AGE_VERSION
          printf '%s\n' "$RESOLVED_AGE_CHECKSUMS" > AGE_CHECKSUMS

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          target: ${{ matrix.target }}

      - name: Install Linux GUI Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Cache Cargo Registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo Build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            target
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: bash scripts/cargo-sanitized.sh fmt --check

      - name: Run Clippy
        run: bash scripts/cargo-sanitized.sh clippy --locked --all-targets -- -D warnings

      - name: Build Binary
        run: bash scripts/cargo-sanitized.sh build --release --locked --target ${{ matrix.target }}

      - name: Run Tests
        run: bash scripts/cargo-sanitized.sh test --locked --verbose

      - name: Configure macOS Developer ID Signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12" || -z "$APPLE_DEVELOPER_ID_APPLICATION" ]]; then
            echo "Apple signing secrets are not configured; producing an ad-hoc signed development artifact."
            exit 0
          fi
          keychain="$RUNNER_TEMP/fortress-signing.keychain-db"
          certificate="$RUNNER_TEMP/fortress-signing.p12"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          echo "FORTRESS_CODESIGN_IDENTITY=$APPLE_DEVELOPER_ID_APPLICATION" >> "$GITHUB_ENV"

      - name: Package Linux AppDir
        if: runner.os == 'Linux'
        run: |
          bash scripts/package-linux.sh "${{ matrix.artifact_path }}" "Fortress.AppDir"
          tar -czf "${{ matrix.package_archive }}" "Fortress.AppDir"

      - name: Package macOS App
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh "${{ matrix.artifact_path }}" "Fortress.app"

      - name: Notarize macOS App
        if: runner.os == 'macOS'
        env:
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$FORTRESS_CODESIGN_IDENTITY" || -z "$APPLE_NOTARY_ID" || -z "$APPLE_NOTARY_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Apple notarization secrets are not configured; skipping notarization."
            exit 0
          fi
          submission="$RUNNER_TEMP/fortress-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "Fortress.app" "$submission"
          xcrun notarytool submit "$submission" --wait \
            --apple-id "$APPLE_NOTARY_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "Fortress.app"
          xcrun stapler validate "Fortress.app"

      - name: Archive macOS App
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "Fortress.app" "${{ matrix.package_archive }}"

      - name: Package Windows App
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/package-windows.sh "${{ matrix.artifact_path }}" "Fortress Windows"

      - name: Archive Windows App
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath 'Fortress Windows' -DestinationPath '${{ matrix.package_archive }}' -Force

      - name: Check Binary Path Leaks
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bash scripts/check-binary-paths.sh \
              "${{ matrix.artifact_path }}" \
              "Fortress.app/Contents/MacOS/Fortress" \
              "Fortress.app/Contents/MacOS/fortress-core" \
              "Fortress.app/Contents/MacOS/age" \
              "Fortress.app/Contents/MacOS/age-keygen"
          else
            bash scripts/check-binary-paths.sh "${{ matrix.artifact_path }}"
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
          compression-level: 6
          overwrite: true

      - name: Upload Linux AppDir Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.package_artifact_name }}
          path: ${{ matrix.package_archive }}
          if-no-files-found: error
          compression-level: 6
          overwrite: true

      - name: Upload macOS App Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.package_artifact_name }}
          path: ${{ matrix.package_archive }}
          if-no-files-found: error
          compression-level: 6
          overwrite: true

      - name: Upload Windows App Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.package_artifact_name }}
          path: ${{ matrix.package_archive }}
          if-no-files-found: error
          compression-level: 6
          overwrite: true

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache Cargo Registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Dependency Audit
        run: cargo audit
